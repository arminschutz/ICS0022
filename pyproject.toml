[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ics0022-secure-file-manager"
version = "0.2.0"
description = "A small authenticated command-line file manager for ICS0022"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0", "argon2-cffi>=23.1"]

[project.scripts]
fileman = "file_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
